name: Construire l'APK Android

on:
  push:
    branches:
      - main
      - agent/chatgpt-cut-video-plugin
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests et APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Lire la version Android
        id: app_version
        shell: bash
        run: |
          VERSION_NAME=$(sed -n "s/.*versionName = '\([^']*\)'.*/\1/p" app/build.gradle | head -n 1)
          if [ -z "$VERSION_NAME" ]; then
            echo "Impossible de lire versionName dans app/build.gradle" >&2
            exit 1
          fi
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "APK version: $VERSION_NAME"

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Préparer Android SDK préinstallé
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Installer Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Tester, analyser et compiler
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Préparer le fichier à télécharger
        env:
          APP_VERSION: ${{ steps.app_version.outputs.version }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Cut-Video-v${APP_VERSION}.apk"
          cd dist
          sha256sum "Cut-Video-v${APP_VERSION}.apk" > "Cut-Video-v${APP_VERSION}.apk.sha256"

      - name: Publier l'APK dans les Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Cut-Video-APK-v${{ steps.app_version.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 90

      - name: Publier la Release GitHub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.app_version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${APP_VERSION}"
          APK="dist/Cut-Video-v${APP_VERSION}.apk"
          SHA="dist/Cut-Video-v${APP_VERSION}.apk.sha256"
          NOTES="Cut Vidéo ${APP_VERSION} — mise à jour interne reconstruite : vérification automatique, reprise après autorisation Android, téléchargement contrôlé et installation depuis l'application."

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Cut Vidéo v${APP_VERSION}" \
              --notes "$NOTES"
          else
            gh release edit "$TAG" \
              --title "Cut Vidéo v${APP_VERSION}" \
              --notes "$NOTES"
          fi

          upload_with_retry() {
            local file="$1"
            local attempt
            for attempt in 1 2 3 4 5; do
              if gh release upload "$TAG" "$file" --clobber; then
                return 0
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "Échec définitif de l'upload de $file" >&2
                return 1
              fi
              sleep $((attempt * 10))
            done
          }

          upload_with_retry "$APK"
          upload_with_retry "$SHA"
