name: Construire l'APK Android

on:
  push:
    branches:
      - main
      - agent/chatgpt-cut-video-plugin
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests et APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Lire la version Android
        id: app_version
        shell: bash
        run: |
          VERSION_NAME=$(sed -n "s/.*versionName = '\([^']*\)'.*/\1/p" app/build.gradle | head -n 1)
          if [ -z "$VERSION_NAME" ]; then
            echo "Impossible de lire versionName dans app/build.gradle" >&2
            exit 1
          fi
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "APK version: $VERSION_NAME"

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Préparer Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Installer Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Vérifier la signature stable
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.CUTVIDEO_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.CUTVIDEO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CUTVIDEO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CUTVIDEO_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Signature stable absente : aucun APK de release ne sera publié."
          fi

      - name: Préparer la clé de signature
        if: steps.signing.outputs.ready == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.CUTVIDEO_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.CUTVIDEO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CUTVIDEO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CUTVIDEO_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/cut-video-release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          echo "::add-mask::$KEYSTORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          echo "CUTVIDEO_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "CUTVIDEO_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "CUTVIDEO_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "CUTVIDEO_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Tester et compiler DEBUG
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Compiler RELEASE signée
        if: steps.signing.outputs.ready == 'true'
        run: gradle --no-daemon assembleRelease

      - name: Publier l'APK DEBUG dans les Artifacts
        env:
          APP_VERSION: ${{ steps.app_version.outputs.version }}
        shell: bash
        run: |
          mkdir -p dist-debug
          cp app/build/outputs/apk/debug/app-debug.apk "dist-debug/Cut-Video-DEBUG-v${APP_VERSION}.apk"
          sha256sum "dist-debug/Cut-Video-DEBUG-v${APP_VERSION}.apk" > "dist-debug/Cut-Video-DEBUG-v${APP_VERSION}.apk.sha256"

      - name: Artifact DEBUG
        uses: actions/upload-artifact@v4
        with:
          name: Cut-Video-DEBUG-v${{ steps.app_version.outputs.version }}
          path: dist-debug/
          if-no-files-found: error
          retention-days: 30

      - name: Préparer la RELEASE signée
        if: steps.signing.outputs.ready == 'true'
        env:
          APP_VERSION: ${{ steps.app_version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Cut-Video-v${APP_VERSION}.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "dist/Cut-Video-v${APP_VERSION}.apk"
          sha256sum "dist/Cut-Video-v${APP_VERSION}.apk" > "dist/Cut-Video-v${APP_VERSION}.apk.sha256"

      - name: Artifact RELEASE signée
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Cut-Video-RELEASE-v${{ steps.app_version.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 90

      - name: Publier la Release GitHub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.signing.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.app_version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${APP_VERSION}"
          APK="dist/Cut-Video-v${APP_VERSION}.apk"
          SHA="dist/Cut-Video-v${APP_VERSION}.apk.sha256"
          NOTES="Cut Vidéo ${APP_VERSION} — APK RELEASE signé avec la clé permanente Cut Vidéo. Les prochaines mises à jour Android doivent conserver exactement cette même clé."

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Cut Vidéo v${APP_VERSION}" --notes "$NOTES"
          else
            gh release edit "$TAG" --title "Cut Vidéo v${APP_VERSION}" --notes "$NOTES"
          fi

          gh release upload "$TAG" "$APK" --clobber
          gh release upload "$TAG" "$SHA" --clobber
