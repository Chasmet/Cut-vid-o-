name: Construire l'APK Android

on:
  push:
    branches:
      - main
      - agent/chatgpt-cut-video-plugin
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests et APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Lire la version Android
        id: app_version
        shell: bash
        run: |
          VERSION_NAME=$(sed -n "s/.*versionName = '\([^']*\)'.*/\1/p" app/build.gradle | head -n 1)
          if [ -z "$VERSION_NAME" ]; then
            echo "Impossible de lire versionName dans app/build.gradle" >&2
            exit 1
          fi
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "APK version: $VERSION_NAME"

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3

      - name: Installer Android 16
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Installer Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Tester, analyser et compiler
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Préparer le fichier à télécharger
        env:
          APP_VERSION: ${{ steps.app_version.outputs.version }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Cut-Video-v${APP_VERSION}.apk"
          cd dist
          sha256sum "Cut-Video-v${APP_VERSION}.apk" > "Cut-Video-v${APP_VERSION}.apk.sha256"

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Cut-Video-APK-v${{ steps.app_version.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 90

      - name: Publier la version téléchargeable
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.app_version.outputs.version }}
        run: |
          TAG="v${APP_VERSION}"
          APK="dist/Cut-Video-v${APP_VERSION}.apk"
          SHA="dist/Cut-Video-v${APP_VERSION}.apk.sha256"
          NOTES="Cut Vidéo ${APP_VERSION}. ChatGPT peut maintenant envoyer de vraies commandes de programmation à l'application. L'APK les récupère automatiquement quand elle est ouverte, écrit réellement les programmations et rappels Android, puis confirme le résultat au serveur. Tant que l'APK n'a pas confirmé l'écriture, le connecteur indique EN ATTENTE APK au lieu de PROGRAMMÉ."
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$SHA" --clobber
          else
            gh release create "$TAG" "$APK" "$SHA" \
              --title "Cut Vidéo v${APP_VERSION}" \
              --notes "$NOTES"
          fi
