name: Construire l'APK Android

on:
  push:
    branches:
      - main
      - agent/chatgpt-cut-video-plugin
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests et APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Lire la version Android
        id: app_version
        shell: bash
        run: |
          VERSION_NAME=$(sed -n "s/.*versionName = '\([^']*\)'.*/\1/p" app/build.gradle | head -n 1)
          if [ -z "$VERSION_NAME" ]; then
            echo "Impossible de lire versionName dans app/build.gradle" >&2
            exit 1
          fi
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "APK version: $VERSION_NAME"

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Préparer Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Installer Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Tester et compiler DEBUG
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Artifact DEBUG
        env:
          APP_VERSION: ${{ steps.app_version.outputs.version }}
        shell: bash
        run: |
          mkdir -p dist-debug
          cp app/build/outputs/apk/debug/app-debug.apk "dist-debug/Cut-Video-DEBUG-v${APP_VERSION}.apk"
          sha256sum "dist-debug/Cut-Video-DEBUG-v${APP_VERSION}.apk" > "dist-debug/Cut-Video-DEBUG-v${APP_VERSION}.apk.sha256"

      - name: Publier le DEBUG dans les Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Cut-Video-DEBUG-v${{ steps.app_version.outputs.version }}
          path: dist-debug/
          if-no-files-found: error
          retention-days: 30

      - name: Récupérer la clé de signature permanente via GitHub OIDC
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          OIDC_JSON=$(curl -fsSL             -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=cut-video-signing")
          OIDC_TOKEN=$(printf '%s' "$OIDC_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')

          SIGNING_JSON="$RUNNER_TEMP/cutvideo-signing.json"
          curl -fsSL             -H "Authorization: Bearer $OIDC_TOKEN"             "https://cut-video-chatgpt-mcp.onrender.com/internal/android-signing-bundle"             -o "$SIGNING_JSON"

          PRIVATE_KEY="$RUNNER_TEMP/cutvideo-release-key.pem"
          CERTIFICATE="$RUNNER_TEMP/cutvideo-release-cert.pem"
          python3 - "$SIGNING_JSON" "$PRIVATE_KEY" "$CERTIFICATE" <<'PY'
          import json, os, pathlib, sys
          data = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          private_key = data.get("private_key_pem", "")
          certificate = data.get("certificate_pem", "")
          if "PRIVATE KEY" not in private_key or "CERTIFICATE" not in certificate:
              raise SystemExit("Matériel de signature invalide")
          pathlib.Path(sys.argv[2]).write_text(private_key, encoding="utf-8")
          pathlib.Path(sys.argv[3]).write_text(certificate, encoding="utf-8")
          os.chmod(sys.argv[2], 0o600)
          os.chmod(sys.argv[3], 0o600)
          PY

          rm -f "$SIGNING_JSON"
          echo "CUTVIDEO_SIGNING_PRIVATE_KEY=$PRIVATE_KEY" >> "$GITHUB_ENV"
          echo "CUTVIDEO_SIGNING_CERTIFICATE=$CERTIFICATE" >> "$GITHUB_ENV"

      - name: Compiler RELEASE non signée
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: gradle --no-daemon assembleRelease

      - name: Signer la RELEASE avec la clé permanente
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          APP_VERSION: ${{ steps.app_version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          UNSIGNED_APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*-unsigned.apk' -print -quit)
          if [ -z "$UNSIGNED_APK" ]; then
            echo "APK release non signé introuvable" >&2
            exit 1
          fi

          mkdir -p dist
          ALIGNED_APK="$RUNNER_TEMP/cut-video-aligned.apk"
          FINAL_APK="dist/Cut-Video-v${APP_VERSION}.apk"

          KEY_DER="$RUNNER_TEMP/cutvideo-release-key.pk8"
          CERT_DER="$RUNNER_TEMP/cutvideo-release-cert.der"
          openssl pkcs8 -topk8 -nocrypt -in "$CUTVIDEO_SIGNING_PRIVATE_KEY" -outform DER -out "$KEY_DER"
          openssl x509 -in "$CUTVIDEO_SIGNING_CERTIFICATE" -outform DER -out "$CERT_DER"

          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -p -f 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign             --key "$KEY_DER"             --cert "$CERT_DER"             --out "$FINAL_APK"             "$ALIGNED_APK"

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$FINAL_APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$FINAL_APK"             | sed -n 's/^Signer #1 certificate SHA-256 digest: //p'             > dist/Cut-Video-signing-cert-sha256.txt
          sha256sum "$FINAL_APK" > "dist/Cut-Video-v${APP_VERSION}.apk.sha256"

      - name: Artifact RELEASE signée
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Cut-Video-RELEASE-v${{ steps.app_version.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 90

      - name: Publier la Release GitHub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.app_version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${APP_VERSION}"
          APK="dist/Cut-Video-v${APP_VERSION}.apk"
          SHA="dist/Cut-Video-v${APP_VERSION}.apk.sha256"
          CERT="dist/Cut-Video-signing-cert-sha256.txt"
          NOTES="Cut Vidéo ${APP_VERSION} — APK RELEASE signé avec la clé permanente Cut Vidéo conservée hors du dépôt. Cette même identité de signature sera réutilisée pour toutes les prochaines mises à jour."

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Cut Vidéo v${APP_VERSION}" --notes "$NOTES"
          else
            gh release edit "$TAG" --title "Cut Vidéo v${APP_VERSION}" --notes "$NOTES"
          fi

          gh release upload "$TAG" "$APK" --clobber
          gh release upload "$TAG" "$SHA" --clobber
          gh release upload "$TAG" "$CERT" --clobber
