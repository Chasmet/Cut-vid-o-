name: Vérifier le plugin ChatGPT

on:
  pull_request:
    paths:
      - "chatgpt-plugin/**"
      - ".github/workflows/chatgpt-plugin.yml"
  push:
    branches:
      - main
      - agent/chatgpt-cut-video-plugin
    paths:
      - "chatgpt-plugin/**"
      - ".github/workflows/chatgpt-plugin.yml"

jobs:
  typecheck:
    name: TypeScript MCP
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chatgpt-plugin

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installer les dépendances
        run: npm install

      - name: Vérifier TypeScript
        run: npm run typecheck
